version: '3.8'

services:
  # Servicio Backend Flask (Gunicorn)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naturgy_flask_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network

  # Servicio Frontend Proxy (Nginx)
  proxy:
    image: nginx:alpine
    container_name: naturgy_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads_data:
    driver: local